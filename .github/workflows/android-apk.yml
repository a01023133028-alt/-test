name: 안드로이드 APK 빌드

# main에 사이트가 바뀔 때마다 앱(APK)을 새로 만들어 Releases에 올린다.
# 작업 브랜치(claude/*)에서는 빌드만 확인하고 파일로 남기고, Releases에는 올리지 않는다.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 빌드
        working-directory: android
        run: |
          VERSION_NAME="1.${{ github.run_number }} ($(cat ../version.json | python3 -c 'import sys,json;print(json.load(sys.stdin)["v"])'))"
          gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk ../weedquiz.apk
          ls -lh ../weedquiz.apk

      - name: 빌드 결과 보관 (작업 브랜치)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: weedquiz-apk
          path: weedquiz.apk
          retention-days: 7

      - name: Releases에 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" weedquiz.apk \
            --title "잡초·병해 퀴즈 앱 1.${{ github.run_number }}" \
            --notes "main 커밋 ${GITHUB_SHA::7} 기준으로 자동 빌드한 APK입니다. 휴대폰에서 weedquiz.apk를 받아 설치하세요." \
            --latest
